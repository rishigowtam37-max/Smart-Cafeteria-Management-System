# The "test" profile, activated for every test by surefire (see pom.xml).
#
# A profile overlay, not a plain application.properties: test-classes comes
# first on the classpath, so a file by that name would *shadow* the main
# application.properties rather than adding to it - taking the Gemini settings
# with it and failing the context on an unresolved placeholder. Profile files
# layer on top of the main one instead, so only what is below changes.
#
# What changes: @SpringBootTest boots the real context, datasource included.
# Left alone it would open the same backend/data/flowbite file the running
# application uses - writing test orders into real data, and failing differently
# depending on what was already in there.
#
# A fresh in-memory database instead. DB_CLOSE_DELAY=-1 keeps it alive across
# context refreshes within the run rather than dropping every table when the
# last connection closes.
spring.datasource.url=jdbc:h2:mem:flowbite-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
