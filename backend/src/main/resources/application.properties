# FlowBite backend configuration.

spring.application.name=FlowBite

# The React dev server runs on 5173 and proxies /api here.
server.port=8080

# Carts hold reserved stock, so abandoned sessions must not hold it for long.
# Session expiry releases every reserved unit (see CartSessionListener).
server.servlet.session.timeout=10m

# Keep JSON responses lean - absent fields are simply not sent.
spring.jackson.default-property-inclusion=non_null

# --- Order storage ------------------------------------------------------------
# File-based H2, embedded in this JVM - nothing to install or start. Only orders
# are kept here; the menu reloads from data/menu.json every boot and carts live
# in the session, so stock resets on restart while placed orders do not.
#
# flowbite.data-dir is set in FlowBiteApplication.main before the context starts,
# so `./mvnw spring-boot:run` (from backend/) and `java -jar` (from the repo
# root) open the same file. The default below only applies if that is bypassed.
spring.datasource.url=jdbc:h2:file:${flowbite.data-dir:./data}/flowbite
spring.datasource.username=sa
spring.datasource.password=

# Boot only runs schema.sql automatically for URLs it recognises as embedded, and
# a file-based H2 URL is not one of them. The script is "create table if not
# exists" throughout, so running it on every start is a no-op after the first.
spring.sql.init.mode=always

# Read the untracked .env at the repository root as a properties file, so the
# Gemini key lives in one gitignored place. Both paths are tried: the first when
# the jar runs from the repository root, the second when Maven runs from backend/.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# --- Smart Craving -----------------------------------------------------------
# The key is read by the JVM and never sent to the browser. Leave it unset and
# the feature switches itself off: /api/config reports smartCravingEnabled=false
# and the React app hides the panel.
flowbite.gemini.api-key=${GEMINI_API_KEY:}

# Google retires model ids - gemini-2.5-flash already returns 404 for new keys -
# so this is a property rather than a constant. List what your key can use with:
#   curl -H "x-goog-api-key: $GEMINI_API_KEY" \
#        https://generativelanguage.googleapis.com/v1beta/models
flowbite.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
flowbite.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
